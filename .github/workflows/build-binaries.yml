name: Build & Release Desktop Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: true
        default: 'Swords & Arrows v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Assets (Vite + TS)
        run: npm run build

      - name: Package Desktop Binary
        run: npx electron-builder --publish never

      - name: Verify macOS Code Signing
        if: runner.os == 'macOS'
        run: |
          echo "=== Verifying macOS Application Signatures ==="
          for app in release/mac*/*.app; do
            if [ -d "$app" ]; then
              echo "Checking signature for: $app"
              codesign -dv --verbose=4 "$app" || codesign --force --deep --sign - "$app"
            fi
          done
          echo "=== Packaged macOS Artifacts ==="
          ls -lh release/*.dmg release/*.zip

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

  release:
    name: Publish to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    if: always() && !cancelled() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: all-binaries
          merge-multiple: true
          pattern: binaries-*

      - name: List downloaded binaries
        run: ls -la all-binaries

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0.0' }}
          name: ${{ github.event.inputs.release_title || (startsWith(github.ref, 'refs/tags/') && format('Swords & Arrows {0}', github.ref_name)) || 'Swords & Arrows v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            all-binaries/*.exe
            all-binaries/*.dmg
            all-binaries/*.zip
            all-binaries/*.AppImage
            all-binaries/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
